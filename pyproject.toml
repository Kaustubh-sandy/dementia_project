[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dementia"
version = "0.1.0"
requires-python = ">=3.10"
description = "OASIS-1 CNN-ViT feature fusion for CDR-group classification"

[project.scripts]
dementia = "dementia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
